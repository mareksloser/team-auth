controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# /oauth/authorize a /oauth/token z bundlu.
# Starší verze bundlu mají routes.xml – zkontroluj vendor/league/oauth2-server-bundle/config/
oauth2:
    resource: '@LeagueOAuth2ServerBundle/config/routes.php'
    type: php
    prefix: /oauth
