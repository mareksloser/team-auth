security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id

    providers:
        # login form
        users_by_email:
            entity: { class: App\Entity\User, property: email }
        # tokens carry `sub` = user uuid
        users_by_uuid:
            entity: { class: App\Entity\User, property: uuid }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|css|images|js)/
            security: false

        oidc_public:
            pattern: ^/(\.well-known/|oauth/token|branding/)
            security: false

        userinfo:
            pattern: ^/userinfo
            stateless: true
            provider: users_by_uuid
            oauth2: true

        # Bearer-token API for club apps (GET /api/directory)
        api:
            pattern: ^/api/
            stateless: true
            provider: users_by_uuid
            oauth2: true

        main:
            lazy: true
            provider: users_by_email
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_home
            login_throttling:   # also limits two-factor code attempts
                max_attempts: 5
                interval: '15 minutes'
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                default_target_path: app_home
                enable_csrf: true
            logout:
                path: app_logout   # response is set by App\EventListener\OidcLogoutListener

    access_control:
        # Browser background requests must not trigger a login: they would overwrite the
        # "where to return" target path while the login or two-factor page is open.
        - { path: '^/(favicon\.ico|apple-touch-icon[^/]*\.png|robots\.txt|site\.webmanifest)$', roles: PUBLIC_ACCESS }
        # Two-factor rules must come first.
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/userinfo, roles: ROLE_OAUTH2_OPENID }
        - { path: ^/api/directory, roles: ROLE_OAUTH2_ROLES }
        - { path: ^/api/, roles: ROLE_NO_ACCESS }
        - { path: ^/oauth/authorize, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/admin, roles: ROLE_SUPERADMIN }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
