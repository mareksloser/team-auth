# Application backend (e.g. MVR API) – validates access tokens from the club IdP.
# composer require symfony/security-bundle symfony/http-client web-token/jwt-library
security:
    providers:
        club:
            id: App\Security\ClubUserProvider

    firewalls:
        api:
            pattern: ^/api
            stateless: true
            provider: club
            access_token:
                token_handler:
                    oidc:
                        claim: sub
                        audience: 'mvr-web'          # client_id of the SPA the token was issued for
                        issuers: ['%env(OIDC_ISSUER)%']
                        algorithms: ['RS256']
                        # Symfony 7.3+: keys from discovery (trailing slash required)
                        discovery:
                            base_uri: '%env(OIDC_ISSUER)%/'
                            cache:
                                id: cache.app
                        # Older Symfony: instead of discovery
                        # keyset: '%env(OIDC_JWKS)%'   # contents of /.well-known/jwks.json

    access_control:
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_COACH }
        - { path: ^/api, roles: ROLE_USER }
